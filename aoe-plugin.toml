# Fleet: one dashboard pane for every machine's AoE sessions.
# Schema reference:
# https://agent-of-empires.com/docs/api/plugin-api/

id = "dev.hyunwook.fleet"
name = "Fleet"
version = "0.6.1"
api_version = 16
aoe_version = ">=1.20.0, <2.0.0"
description = "여러 장비의 AoE 세션 상태를 대시보드 한 패널에 모아 보여줍니다. 사용량은 dev.hyunwook.usage 플러그인이 맡습니다."

# net: polls other hosts' `aoe serve`. process.spawn: runs this hub's `aoe` CLI to manage LAN mirror sessions.
capabilities = ["runtime.worker", "net", "process.spawn", "session.read"]

[[commands]]
id = "refresh"
title = "Fleet: 지금 새로고침"

[[settings]]
key = "hosts"
label = "장비 목록"
description = "각 장비의 aoe serve 주소. 토큰은 설정에 넣지 않고 token_file 경로로 읽습니다. 로컬(127.0.0.1) 주소는 비워 두면 ~/.agent-of-empires/serve.token 을 씁니다."
type = "object_list"
max_items = 20

[[settings.fields]]
key = "name"
label = "장비 이름"
required = true

[[settings.fields]]
key = "url"
label = "aoe serve URL (예: https://m4-01.tailnet.ts.net)"
required = true

[[settings.fields]]
key = "token_file"
label = "토큰 파일 경로 (선택)"

[[settings.fields]]
key = "attach_agent"
label = "내부망 연결 에이전트 (선택). 이 허브의 AoE custom agent 이름(예: lan-m4 = \"ssh -t m4\")을 넣으면 그 장비의 세션마다 허브에 연결 세션을 만들어 여기서 바로 엽니다"

[[settings.fields]]
key = "tmux_bin"
label = "그 장비의 tmux 경로 (선택, 기본 tmux. macOS Homebrew는 /opt/homebrew/bin/tmux)"

[[settings.fields]]
key = "link_url"
label = "세션 열기 주소 (선택, 예: https://aoe-m4.example.com). URL이 터널용 로컬 주소일 때 브라우저가 열 그 장비의 대시보드 주소"


[[settings]]
key = "mirror_skip_groups"
label = "연결 세션을 만들지 않을 그룹"
description = "원격 장비의 이 그룹(맨 앞 이름) 세션에는 허브 연결 세션을 만들지 않습니다. 예: 사용량 확인처럼 화면 크기가 바뀌면 안 되는 상시 세션."
type = "string_list"

[[settings]]
key = "home_pane"
label = "홈 화면에 패널 표시"
description = "끄면 홈 화면에서는 빠지고 \"장비 · 세션\" 페이지(와 그 상태를 읽는 대시보드)에서만 봅니다."
type = "bool"
default = true

[[settings]]
key = "refresh_secs"
label = "갱신 주기(초)"
type = "integer"
default = 20
min = 5
max = 3600


[[ui]]
slot = "home-pane"
id = "fleet"

[[ui]]
slot = "page"
id = "sessions"
title = "장비 · 세션"
icon = "server"
entry = "sessions.html"


[runtime]
kind = "command"
command = [".aoe-build/worker"]

# Pin the build-time python3 so the daemon's PATH never decides the launch.
[[runtime.build]]
command = ["sh", "-c", "mkdir -p .aoe-build && printf '#!/bin/sh\\nexec %s \"$(dirname \"$0\")/../worker.py\"\\n' \"$(command -v python3)\" > .aoe-build/worker && chmod +x .aoe-build/worker"]
platforms = ["linux", "macos"]
